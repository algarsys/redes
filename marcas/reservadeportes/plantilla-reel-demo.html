<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Fondo de Reel 1080x1920 de ReservaDeportes para la demo interactiva de la web: dos huecos blancos.
     Panel (grande): vídeo en x=40 y=500, 1000x712. Móvil: vídeo en x=60 y=1236, 306x626.
     Datos: {"gancho":"...","linea":"...","cta":"...","panel":"(portada) imagen","movil":"(portada) imagen"} -->
<link rel="stylesheet" href="comun.css">
<style>
html,body{width:1080px;height:1920px}
.cab{position:absolute;left:60px;top:96px}
.cab .logo img{height:120px}
h1{position:absolute;left:60px;right:60px;top:290px;font-size:84px}
.hp{position:absolute;left:28px;top:488px;width:1024px;height:736px;border-radius:30px;background:#fff;box-shadow:0 40px 90px -30px rgba(0,0,0,.55);overflow:hidden}
.hp img{position:absolute;left:12px;top:12px;width:1000px;height:712px}
.hm{position:absolute;left:46px;top:1222px;width:334px;height:654px;border-radius:34px;background:#fff;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);overflow:hidden}
.hm img{position:absolute;left:14px;top:14px;width:306px;height:626px}
.linea{position:absolute;left:420px;right:50px;top:1330px;font-family:'Archivo';font-weight:800;font-size:56px;line-height:1.08;color:#fff}
.cta{position:absolute;left:420px;top:1740px;padding:16px 32px 14px;border-radius:999px;background:var(--orange);color:#fff;font-family:'Archivo';font-weight:800;font-size:40px;white-space:nowrap}
</style></head>
<body class="oscuro">
<div class="cab"><span class="logo"><img src="logo.svg" alt="ReservaDeportes"></span></div>
<h1 id="gancho"></h1>
<div class="hp"><img id="panel" alt="" style="display:none"></div>
<div class="hm"><img id="movil" alt="" style="display:none"></div>
<p class="linea" id="linea"></p>
<span class="cta" id="cta">reservadeportes.com</span>
<div class="franja"></div>
<script>
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function ma(s) { return esc(s).replace(/\*([^*]+)\*/g, '<span class="o">$1</span>'); }
window.pinta = function (d) {
  var $ = function (i) { return document.getElementById(i); };
  $('gancho').innerHTML = ma(d.gancho); $('linea').innerHTML = ma(d.linea); if (d.cta) $('cta').textContent = d.cta;
  ['panel', 'movil'].forEach(function (k) { if (d[k]) { $(k).src = d[k]; $(k).style.display = 'block'; } });
  function encaja(el, alto) { var t = parseFloat(getComputedStyle(el).fontSize); while (el.scrollHeight > alto && t > 36) { t -= 4; el.style.fontSize = t + 'px'; } }
  encaja($('gancho'), 180); encaja($('linea'), 380);
};
</script>
</body></html>
