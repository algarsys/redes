<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Fondo de un Reel hecho con vídeos de partidas reales (1080x1920), escena a escena. Pregunta grande arriba, el nombre
     del juego y un hueco para el vídeo del tamaño que se pida (cada vídeo va recortado a lo que importa de la pantalla).
     Datos: {"gancho":"...","nombre":"Une los puntos, de 5 en 5","video":[x,y,ancho,alto],"fondo":"#FFD23F"}
     o, para la escena final: {"final":true,"titulo":"102 juegos por equipos","sub":"...","cta":"5 partidas gratis en tirayafloja.com"}
     El vídeo se coloca después con ffmpeg en x,y con ese ancho y alto. Lo de abajo de y=1560 lo tapa el texto de Instagram. -->
<style>
@font-face{font-family:'Baloo 2';font-weight:600;src:url('fuentes/baloo2-latin-600.woff2') format('woff2')}
@font-face{font-family:'Baloo 2';font-weight:700;src:url('fuentes/baloo2-latin-700.woff2') format('woff2')}
@font-face{font-family:'Baloo 2';font-weight:800;src:url('fuentes/baloo2-latin-800.woff2') format('woff2')}
:root{--tinta:#1D2B3A;--azul:#2E7BF6;--rosa:#E0329E;--amarillo:#FFD23F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'Baloo 2','Trebuchet MS',Arial,sans-serif;color:var(--tinta);background:var(--amarillo);-webkit-font-smoothing:antialiased;position:relative}
.marca{position:absolute;left:48px;top:140px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:38px}
.marca svg{width:84px;height:84px}
h1{position:absolute;left:48px;right:48px;top:250px;height:290px;display:flex;align-items:center;font-weight:800;font-size:112px;line-height:.94;letter-spacing:-2px}
.nom{position:absolute;left:48px;top:556px;display:inline-block;padding:8px 26px 4px;border-radius:999px;background:var(--tinta);color:#fff;font-weight:800;font-size:38px}
.marco{position:absolute;background:var(--tinta);border-radius:30px;box-shadow:0 26px 60px rgba(29,43,58,.28)}
.fin{position:absolute;left:60px;right:60px;top:300px;display:none;flex-direction:column;align-items:center;text-align:center}
.fin svg{width:380px;height:380px}
.fin .w{margin-top:26px;font-weight:700;font-size:52px}
.fin h2{margin-top:50px;font-weight:800;font-size:118px;line-height:.95;letter-spacing:-2px}
.fin p{margin-top:30px;font-weight:600;font-size:50px;line-height:1.18;color:#3D4B5A}
.fin .cta{margin-top:50px;display:inline-block;padding:18px 44px 12px;border-radius:999px;background:var(--tinta);color:#fff;font-weight:800;font-size:52px}
body.final .marca,body.final h1,body.final .nom,body.final .marco{display:none}
body.final .fin{display:flex}
</style></head>
<body>
<div class="marca"><svg viewBox="0 0 512 512"><path d="M0 110a110 110 0 0 1 110-110h146v512H110A110 110 0 0 1 0 402Z" fill="#2E7BF6"/><path d="M256 0h146a110 110 0 0 1 110 110v292a110 110 0 0 1-110 110H256Z" fill="#E0329E"/><path d="M127 174v164M45 256h164" stroke="#fff" stroke-width="43" stroke-linecap="round"/><path d="M328 197 L440 315 M440 197 L328 315" stroke="#fff" stroke-width="43" stroke-linecap="round"/></svg>tirayafloja.com</div>
<h1 id="gancho">¿Qué dibujo sale?</h1>
<span class="nom" id="nom">Une los puntos</span>
<div class="marco" id="marco"></div>
<div class="fin"><svg viewBox="0 0 512 512"><path d="M0 110a110 110 0 0 1 110-110h146v512H110A110 110 0 0 1 0 402Z" fill="#2E7BF6"/><path d="M256 0h146a110 110 0 0 1 110 110v292a110 110 0 0 1-110 110H256Z" fill="#E0329E"/><path d="M127 174v164M45 256h164" stroke="#fff" stroke-width="43" stroke-linecap="round"/><path d="M328 197 L440 315 M440 197 L328 315" stroke="#fff" stroke-width="43" stroke-linecap="round"/></svg><div class="w">tirayafloja.com</div><h2 id="titulo">102 juegos por equipos</h2><p id="sub"></p><span class="cta" id="cta"></span></div>
<script>
window.pinta = function (d) {
  var $ = function (i) { return document.getElementById(i); };
  if (d.final) {
    document.body.classList.add('final');
    if (d.titulo) $('titulo').textContent = d.titulo;
    $('sub').textContent = d.sub || ''; $('cta').textContent = d.cta || '';
  } else {
    if (d.gancho) $('gancho').textContent = d.gancho;
    if (d.nombre) $('nom').textContent = d.nombre;
    var v = d.video || [60, 650, 960, 900], b = 14, m = $('marco');
    m.style.left = (v[0] - b) + 'px'; m.style.top = (v[1] - b) + 'px'; m.style.width = (v[2] + 2 * b) + 'px'; m.style.height = (v[3] + 2 * b) + 'px';
  }
  if (d.fondo) document.body.style.background = d.fondo;
  var g = $('gancho'), t = parseFloat(getComputedStyle(g).fontSize);
  while (g.scrollHeight > 290 && t > 40) { t -= 4; g.style.fontSize = t + 'px'; }
};
</script>
</body></html>
